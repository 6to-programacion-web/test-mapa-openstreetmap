<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecobici CDMX · Mapa en tiempo real</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root {
    --bg: #f3f6f4; --panel: #ffffff; --ink: #14231c; --muted: #5d6f66; --line: #d5dfd9;
    --accent: #0b7a4b; --ok: #1a9b5b; --low: #e0a100; --none: #d64545; --off: #8a949e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a15; --panel: #172620; --ink: #e8f1ec; --muted: #9bb0a5; --line: #2a3d34;
      --accent: #4cc790; --ok: #3ecf8e; --low: #f0b429; --none: #ef6b6b; --off: #7a858f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    z-index: 1000;
  }
  h1 { font-size: 1.1rem; margin: 0; font-weight: 700; letter-spacing: .01em; }
  h1 span { color: var(--accent); }

  /* Buscador desplegable */
  .combo { position: relative; flex: 1 1 280px; max-width: 460px; }
  .combo input {
    width: 100%; padding: 9px 36px 9px 12px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  .combo input:focus-visible, button:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .combo .chev {
    position: absolute; right: 4px; top: 4px; width: 30px; height: 30px; border: 0;
    background: none; color: var(--muted); cursor: pointer; font-size: 14px;
  }
  .list {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); max-height: 55vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); display: none; padding: 4px;
  }
  .list.open { display: block; }
  .opt { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: .9rem; }
  .opt:hover, .opt.active { background: var(--bg); }
  .opt small { color: var(--muted); white-space: nowrap; }
  .empty { padding: 10px; color: var(--muted); font-size: .9rem; }

  .stats { display: flex; gap: 16px; font-size: .85rem; color: var(--muted); margin-left: auto; align-items: center; flex-wrap: wrap; }
  .stats b { color: var(--ink); font-size: 1rem; }
  button.refresh {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px;
    padding: 7px 12px; font: inherit; cursor: pointer;
  }
  #map { flex: 1; min-height: 0; }
  .legend {
    position: absolute; bottom: 24px; left: 12px; z-index: 900; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .8rem; line-height: 1.6;
  }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .msg {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%); z-index: 950;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; max-width: 90%;
  }
  .leaflet-popup-content { margin: 12px 14px; font-family: inherit; }
  .pop h3 { margin: 0 0 2px; font-size: 1rem; }
  .pop p { margin: 0 0 8px; color: #5d6f66; font-size: .8rem; }
  .pop table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  .pop td { padding: 2px 0; } .pop td:last-child { text-align: right; font-weight: 700; }
  @media (max-width: 600px) { .stats { margin-left: 0; } .legend { bottom: 18px; } }
</style>
</head>
<body>
<header>
  <h1>Ecobici <span>CDMX</span></h1>
  <div class="combo">
    <input id="q" type="text" role="combobox" aria-expanded="false" aria-controls="list" autocomplete="off"
           placeholder="Buscar cicloestación por nombre o número…" disabled>
    <button class="chev" id="toggle" aria-label="Mostrar todas las cicloestaciones" tabindex="-1">▼</button>
    <div class="list" id="list" role="listbox"></div>
  </div>
  <div class="stats">
    <span><b id="nSt">–</b> estaciones</span>
    <span><b id="nBk">–</b> bicis</span>
    <span id="upd">Cargando…</span>
    <button class="refresh" id="refresh">Actualizar</button>
  </div>
</header>

<div id="map"></div>
<div class="legend">
  <div><i style="background:var(--ok)"></i>Muchas bicis (6+)</div>
  <div><i style="background:var(--low)"></i>Pocas bicis (1–5)</div>
  <div><i style="background:var(--none)"></i>Sin bicis</div>
  <div><i style="background:var(--off)"></i>Fuera de servicio</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(() => {
  const GBFS = "https://gbfs.mex.lyftbikes.com/gbfs/gbfs.json";
  const REFRESH_MS = 60000;
  const $ = id => document.getElementById(id);

  // Mapa base: OpenStreetMap
  const map = L.map("map", { zoomControl: true }).setView([19.4326, -99.1332], 13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Datos: <a href="https://ecobici.cdmx.gob.mx">Ecobici</a> (GBFS)'
  }).addTo(map);

  const canvas = L.canvas({ padding: 0.5 });   // render eficiente de cientos de puntos
  let stations = new Map();                    // id -> {info, status, marker}
  let urls = null;
  let options = [];                            // para el buscador
  let activeIdx = -1;

  const getJSON = async url => {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  };

  async function discoverFeeds() {
    const root = await getJSON(GBFS);
    const langs = root.data || {};
    const lang = langs.es || langs.en || langs[Object.keys(langs)[0]];
    const feeds = Object.fromEntries(lang.feeds.map(f => [f.name, f.url]));
    if (!feeds.station_information || !feeds.station_status) throw new Error("Feeds no encontrados");
    urls = feeds;
  }

  function colorFor(s) {
    const css = getComputedStyle(document.documentElement);
    const v = n => css.getPropertyValue(n).trim();
    if (!s || s.is_renting === 0 || s.is_renting === false || s.is_installed === 0 || s.is_installed === false) return v("--off");
    const b = s.num_bikes_available ?? 0;
    return b === 0 ? v("--none") : b <= 5 ? v("--low") : v("--ok");
  }

  const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function popupHTML(st) {
    const i = st.info, s = st.status || {};
    const ebikes = s.num_ebikes_available;
    return `<div class="pop"><h3>${esc(i.name)}</h3><p>${esc(i.address || "")}</p>
      <table>
        <tr><td>Bicis disponibles</td><td>${s.num_bikes_available ?? "–"}</td></tr>
        ${ebikes != null ? `<tr><td>Eléctricas</td><td>${ebikes}</td></tr>` : ""}
        <tr><td>Espacios libres</td><td>${s.num_docks_available ?? "–"}</td></tr>
        <tr><td>Capacidad</td><td>${i.capacity ?? "–"}</td></tr>
        <tr><td>Estado</td><td>${s.is_renting === 0 || s.is_renting === false ? "Fuera de servicio" : "Operando"}</td></tr>
      </table></div>`;
  }

  async function load() {
    $("upd").textContent = "Actualizando…";
    try {
      if (!urls) await discoverFeeds();
      const [info, status] = await Promise.all([
        stations.size ? null : getJSON(urls.station_information),
        getJSON(urls.station_status)
      ]);

      if (info) {
        info.data.stations.forEach(i => {
          const marker = L.circleMarker([i.lat, i.lon], { renderer: canvas, radius: 7, weight: 1.5, color: "#fff", fillOpacity: .95 })
            .bindPopup(() => popupHTML(stations.get(i.station_id)))
            .addTo(map);
          stations.set(i.station_id, { info: i, status: null, marker });
        });
      }

      let totalBikes = 0;
      status.data.stations.forEach(s => {
        const st = stations.get(s.station_id);
        if (!st) return;
        st.status = s;
        st.marker.setStyle({ fillColor: colorFor(s) });
        totalBikes += s.num_bikes_available || 0;
        if (st.marker.isPopupOpen()) st.marker.setPopupContent(popupHTML(st));
      });

      $("nSt").textContent = stations.size;
      $("nBk").textContent = totalBikes.toLocaleString("es-MX");
      $("upd").textContent = "Actualizado " + new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
      buildOptions();
      $("q").disabled = false;
      $("msg")?.remove();
    } catch (e) {
      console.error(e);
      $("upd").textContent = "Error al cargar";
      if (!$("msg")) {
        const d = document.createElement("div");
        d.id = "msg"; d.className = "msg";
        d.textContent = "No se pudieron cargar los datos de Ecobici. Revisa tu conexión e intenta de nuevo con «Actualizar».";
        document.body.appendChild(d);
      }
    }
  }

  // Buscador desplegable
  const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  function buildOptions() {
    options = [...stations.values()]
      .map(s => ({ id: s.info.station_id, name: s.info.name, key: norm(s.info.name + " " + (s.info.short_name || "") + " " + s.info.station_id), bikes: s.status?.num_bikes_available }))
      .sort((a, b) => a.name.localeCompare(b.name, "es", { numeric: true }));
    renderList($("q").value);
  }

  function renderList(filter = "") {
    const f = norm(filter.trim());
    const matches = options.filter(o => !f || o.key.includes(f)).slice(0, 80);
    activeIdx = -1;
    $("list").innerHTML = matches.length
      ? matches.map(o => `<div class="opt" role="option" tabindex="-1" data-id="${esc(o.id)}"><span>${esc(o.name)}</span><small>${o.bikes ?? "–"} bicis</small></div>`).join("")
      : `<div class="empty">Sin resultados</div>`;
  }

  const setOpen = open => { $("list").classList.toggle("open", open); $("q").setAttribute("aria-expanded", open); };

  function pick(id) {
    const st = stations.get(id);
    if (!st) return;
    $("q").value = st.info.name;
    setOpen(false);
    map.flyTo([st.info.lat, st.info.lon], 17, { duration: .8 });
    map.once("moveend", () => st.marker.openPopup());
  }

  $("q").addEventListener("input", e => { renderList(e.target.value); setOpen(true); });
  $("q").addEventListener("focus", e => { e.target.select(); renderList(""); setOpen(true); });
  $("toggle").addEventListener("click", () => {
    const open = !$("list").classList.contains("open");
    if (open) { $("q").value = ""; renderList(""); $("q").focus(); }
    setOpen(open);
  });
  $("list").addEventListener("click", e => { const o = e.target.closest(".opt"); if (o) pick(o.dataset.id); });
  $("q").addEventListener("keydown", e => {
    const items = [...$("list").querySelectorAll(".opt")];
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); setOpen(true);
      activeIdx = (activeIdx + (e.key === "ArrowDown" ? 1 : -1) + items.length) % (items.length || 1);
      items.forEach((it, i) => it.classList.toggle("active", i === activeIdx));
      items[activeIdx]?.scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") {
      const it = items[activeIdx] || items[0];
      if (it) pick(it.dataset.id);
    } else if (e.key === "Escape") setOpen(false);
  });
  document.addEventListener("click", e => { if (!e.target.closest(".combo")) setOpen(false); });

  $("refresh").addEventListener("click", load);
  load();
  setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
})();
</script>
</body>
</html>
