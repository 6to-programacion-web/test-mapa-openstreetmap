<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecobici CDMX · Mapa en tiempo real</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root {
    --bg:#f3f6f4; --panel:#fff; --ink:#14231c; --muted:#4d5f56; --line:#d5dfd9; --sel:#eaf3ee;
    --accent:#0b7a4b; --ok:#0b7a4b; --low:#d99a00; --none:#c93a3a; --off:#6f7b84; color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1a15; --panel:#172620; --ink:#e8f1ec; --muted:#9bb0a5; --line:#2a3d34; --sel:#1f3329;
      --accent:#4cc790; --ok:#3ecf8e; --low:#f0b429; --none:#ef6b6b; --off:#8a959e; color-scheme:dark;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
  button, input { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  header { flex:none; height:60px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:0 14px; z-index:1200; }
  h1 { font-size:1.1rem; margin:0; }
  h1 span { color:var(--accent); }
  .btn { height:44px; padding:0 14px; border:1px solid var(--line); border-radius:8px; background:var(--bg); cursor:pointer; }
  .icon { width:44px; padding:0; display:flex; align-items:center; justify-content:center; }
  .stats { margin-left:auto; display:flex; gap:18px; align-items:center; font-size:.85rem; color:var(--muted); }
  .stats b { color:var(--ink); font-size:1rem; }
  .layout { flex:1; min-height:0; display:flex; position:relative; }
  aside { width:340px; flex:none; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; z-index:1100; transition:margin-left .2s; }
  body.closed aside { margin-left:-340px; visibility:hidden; transition:margin-left .2s, visibility 0s .2s; }
  .filters { padding:16px; display:flex; flex-direction:column; gap:16px; border-bottom:1px solid var(--line); }
  .fhead { display:flex; align-items:center; justify-content:space-between; }
  h2 { margin:0; font-size:1rem; }
  .link { border:0; background:none; color:var(--accent); font-weight:700; text-decoration:underline; cursor:pointer; height:36px; padding:0 6px; }
  label.t { display:block; font-size:.9rem; font-weight:700; margin-bottom:6px; }
  .field { position:relative; }
  .field input { width:100%; height:44px; padding:0 40px 0 12px; border:1px solid var(--muted); border-radius:8px; background:var(--bg); font-size:.9rem; }
  .field button { position:absolute; right:4px; top:4px; width:36px; height:36px; border:0; background:none; color:var(--muted); cursor:pointer; font-size:16px; }
  .hint { min-height:0; margin-top:6px; font-size:.8rem; color:var(--muted); }
  .hint:empty { display:none; }
  .hint.err { color:var(--none); font-weight:700; }
  fieldset { margin:0; padding:0; border:0; display:flex; flex-direction:column; gap:8px; }
  legend { padding:0; margin-bottom:8px; font-size:.9rem; font-weight:700; }
  .chk { display:flex; align-items:center; gap:10px; min-height:44px; padding:0 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel); font-size:.9rem; cursor:pointer; }
  .chk input { width:18px; height:18px; margin:0; accent-color:var(--accent); }
  .sw { width:12px; height:12px; border-radius:50%; flex:none; }
  .chk .n { margin-left:auto; font-size:.8rem; color:var(--muted); }
  .count { flex:none; padding:10px 16px; font-size:.85rem; color:var(--muted); border-bottom:1px solid var(--line); }
  .count b { color:var(--ink); }
  #results { flex:1; min-height:0; overflow-y:auto; }
  .row { width:100%; display:flex; align-items:center; gap:10px; padding:10px 16px; border:0; border-bottom:1px solid var(--line); background:none; text-align:left; cursor:pointer; font-size:.9rem; min-height:44px; content-visibility:auto; contain-intrinsic-size:auto 44px; }
  .row:hover, .row.sel { background:var(--sel); }
  .row .sw { width:10px; height:10px; }
  .row small { margin-left:auto; color:var(--muted); white-space:nowrap; }
  .pager { flex:none; display:flex; align-items:center; gap:8px; padding:10px 12px; border-top:1px solid var(--line); background:var(--panel); }
  .pager[hidden] { display:none; }
  .pager button { width:44px; height:44px; flex:none; border:1px solid var(--line); border-radius:8px; background:var(--bg); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .pager button:disabled { opacity:.4; cursor:default; }
  .pager .info { flex:1; text-align:center; font-size:.8rem; line-height:1.35; color:var(--muted); }
  .pager .info b { color:var(--ink); }
  .note { padding:14px 16px; color:var(--muted); font-size:.85rem; }
  #map { flex:1; min-width:0; }
  .msg { position:absolute; top:76px; left:50%; transform:translateX(-50%); z-index:1300; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; max-width:90%; }
  .leaflet-popup-content { margin:12px 14px; font-family:inherit; color:#14231c; }
  .pop h3 { margin:0 0 2px; font-size:1rem; }
  .pop p { margin:0 0 8px; color:#4d5f56; font-size:.8rem; }
  .pop table { border-collapse:collapse; width:100%; font-size:.85rem; }
  .pop td:last-child { text-align:right; font-weight:700; }
  @media (max-width:700px) {
    aside { position:absolute; inset:0 auto 0 0; width:min(340px,90vw); box-shadow:4px 0 18px rgba(0,0,0,.25); }
    body.closed aside { margin-left:calc(-1 * min(340px,90vw)); }
    .stats .hide-m { display:none; }
    .stats { gap:10px; }
  }
</style>
</head>
<body>
<header>
  <button class="btn icon" id="menu" aria-label="Mostrar u ocultar filtros" aria-controls="panel">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <h1>Ecobici <span>CDMX</span></h1>
  <div class="stats">
    <span class="hide-m"><b id="nSt">–</b> estaciones</span>
    <span><b id="nBk">–</b> bicis</span>
    <span class="hide-m" id="upd">Cargando…</span>
    <button class="btn" id="refresh">Actualizar</button>
  </div>
</header>

<div class="layout">
  <aside id="panel" aria-label="Filtros de cicloestaciones">
    <div class="filters">
      <div class="fhead"><h2>Filtros</h2><button class="link" id="clear">Limpiar filtros</button></div>
      <div>
        <label class="t" for="q">Nombre de la estación</label>
        <div class="field">
          <input id="q" type="search" placeholder="Nombre (3+ letras) o número (ej. 002)" autocomplete="off" aria-describedby="hint" disabled>
          <button id="qx" aria-label="Borrar búsqueda">✕</button>
        </div>
        <div class="hint" id="hint" aria-live="polite"></div>
      </div>
      <fieldset id="status">
        <legend>Estatus</legend>
        <label class="chk"><input type="checkbox" value="ok" checked><span class="sw" style="background:var(--ok)"></span>Muchas bicis (6 o más)<span class="n" data-n="ok"></span></label>
        <label class="chk"><input type="checkbox" value="low" checked><span class="sw" style="background:var(--low)"></span>Pocas bicis (1 a 5)<span class="n" data-n="low"></span></label>
        <label class="chk"><input type="checkbox" value="none" checked><span class="sw" style="background:var(--none)"></span>Sin bicis<span class="n" data-n="none"></span></label>
        <label class="chk"><input type="checkbox" value="off" checked><span class="sw" style="background:var(--off)"></span>Fuera de servicio<span class="n" data-n="off"></span></label>
      </fieldset>
    </div>
    <div class="count" aria-live="polite" id="count">Cargando estaciones…</div>
    <div id="results"></div>
    <nav class="pager" id="pager" aria-label="Paginación de resultados" hidden>
      <button id="prev" aria-label="Página anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
      <div class="info" id="pInfo" aria-live="polite"></div>
      <button id="next" aria-label="Página siguiente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
    </nav>
  </aside>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(() => {
  const GBFS = "https://gbfs.mex.lyftbikes.com/gbfs/gbfs.json";
  const REFRESH_MS = 60000;
  const $ = id => document.getElementById(id);
  const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const isMobile = () => matchMedia("(max-width:700px)").matches;

  if (isMobile()) document.body.classList.add("closed");

  const map = L.map("map").setView([19.4326, -99.1332], 13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Datos: <a href="https://ecobici.cdmx.gob.mx">Ecobici</a> (GBFS)'
  }).addTo(map);
  const canvas = L.canvas({ padding: 0.5 });

  let stations = new Map(), urls = null, selectedId = null;
  const filter = { p: { mode: "empty" }, on: new Set(["ok", "low", "none", "off"]) };
  let lastSig = "", page = 0;
  const PAGE_SIZE = 50;

  const getJSON = async url => { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); };

  async function discoverFeeds() {
    const root = await getJSON(GBFS), langs = root.data || {};
    const lang = langs.es || langs.en || langs[Object.keys(langs)[0]];
    const feeds = Object.fromEntries(lang.feeds.map(f => [f.name, f.url]));
    if (!feeds.station_information || !feeds.station_status) throw new Error("Feeds no encontrados");
    urls = feeds;
  }

  const falsy = v => v === 0 || v === false;
  function statusOf(s) {
    if (!s || falsy(s.is_renting) || falsy(s.is_installed)) return "off";
    const b = s.num_bikes_available ?? 0;
    return b === 0 ? "none" : b <= 5 ? "low" : "ok";
  }

  function popupHTML(st) {
    const i = st.info, s = st.status || {};
    return `<div class="pop"><h3>${esc(i.name)}</h3><p>${esc(i.address || "")}</p><table>
      <tr><td>Bicis disponibles</td><td>${s.num_bikes_available ?? "–"}</td></tr>
      ${s.num_ebikes_available != null ? `<tr><td>Eléctricas</td><td>${s.num_ebikes_available}</td></tr>` : ""}
      <tr><td>Espacios libres</td><td>${s.num_docks_available ?? "–"}</td></tr>
      <tr><td>Capacidad</td><td>${i.capacity ?? "–"}</td></tr>
      <tr><td>Estado</td><td>${st.cat === "off" ? "Fuera de servicio" : "Operando"}</td></tr></table></div>`;
  }

  // Reglas de búsqueda: 1 a 3 dígitos (número de CE) o al menos 3 letras
  function parseQuery(raw) {
    const q = raw.trim();
    if (!q) return { mode: "empty" };
    if (!/^[\p{L}\d\s.\-()'’,\/°]+$/u.test(q)) return { mode: "invalid", msg: "Usa solo letras, números y guiones." };
    const m = q.match(/^(?:ce[\s-]*)?(\d{1,3})$/i);
    if (m) return { mode: "num", num: m[1].padStart(3, "0") };
    if (/^\d+$/.test(q)) return { mode: "invalid", msg: "El número de estación tiene de 1 a 3 dígitos." };
    if ((q.match(/\p{L}/gu) || []).length >= 3) return { mode: "text", tokens: norm(q).split(/\s+/) };
    return { mode: "invalid", msg: "Escribe al menos 3 letras o un número de estación (ej. 002)." };
  }
  const nameMatch = (st, p) =>
    p.mode === "num" ? st.ce.includes(p.num) : p.mode === "text" ? p.tokens.every(t => st.key.includes(t)) : true;

  // Aplica filtros: atenúa en el mapa y reconstruye la lista solo si cambió
  function applyFilters() {
    const css = getComputedStyle(document.documentElement);
    const col = Object.fromEntries(["ok", "low", "none", "off"].map(k => [k, css.getPropertyValue("--" + k).trim()]));
    const p = filter.p, counts = { ok: 0, low: 0, none: 0, off: 0 }, shown = [];
    stations.forEach(st => {
      const nameOk = nameMatch(st, p);
      if (nameOk) counts[st.cat]++;
      const match = nameOk && filter.on.has(st.cat);
      const sig = st.cat + (match ? 1 : 0);
      if (st.sig !== sig) {
        st.sig = sig;
        st.marker.setStyle({ fillColor: col[st.cat], fillOpacity: match ? .95 : .12, opacity: match ? 1 : .2, radius: match ? 7 : 5 });
      }
      st.match = match;
      if (match) shown.push(st);
    });
    document.querySelectorAll("[data-n]").forEach(el => el.textContent = counts[el.dataset.n]);
    shown.sort((a, b) => a.info.name.localeCompare(b.info.name, "es", { numeric: true }));
    const pages = Math.max(1, Math.ceil(shown.length / PAGE_SIZE));
    if (page >= pages) page = pages - 1;
    const start = page * PAGE_SIZE, items = shown.slice(start, start + PAGE_SIZE);
    $("count").innerHTML = `Resultados <b>${shown.length}</b> de ${stations.size} estaciones`;
    $("pager").hidden = shown.length <= PAGE_SIZE;
    $("pInfo").innerHTML = `Estaciones <b>${start + 1}–${start + items.length}</b> de ${shown.length}<br>Página <b>${page + 1}</b> de ${pages}`;
    $("prev").disabled = page === 0;
    $("next").disabled = page >= pages - 1;
    const listSig = items.map(s => s.info.station_id + s.cat + (s.status?.num_bikes_available ?? "")).join("|") + "#" + selectedId + "#" + page;
    if (listSig !== lastSig) {
      lastSig = listSig;
      const raw = $("q").value.trim();
      $("results").innerHTML = shown.length
        ? items.map(st => `<button class="row${st.info.station_id === selectedId ? " sel" : ""}" data-id="${esc(st.info.station_id)}"><span class="sw" style="background:${col[st.cat]}"></span><span>${esc(st.info.name)}</span><small>${st.status?.num_bikes_available ?? "–"} bicis</small></button>`).join("")
        : `<div class="note">${p.mode === "num" || p.mode === "text" ? `Sin resultados para «${esc(raw)}» con los estatus elegidos.` : "Ninguna estación coincide con los filtros."} Prueba con otro dato o activa más estatus.</div>`;
    }
    return shown;
  }

  function pick(id) {
    const st = stations.get(id); if (!st) return;
    selectedId = id;
    if (isMobile()) toggleMenu(false);
    map.flyTo([st.info.lat, st.info.lon], 17, { duration: .8 });
    map.once("moveend", () => st.marker.openPopup());
    document.querySelectorAll(".row").forEach(r => r.classList.toggle("sel", r.dataset.id === id));
  }

  function toggleMenu(open) {
    document.body.classList.toggle("closed", open === undefined ? !document.body.classList.contains("closed") : !open);
    setTimeout(() => map.invalidateSize(), 250);
  }

  async function load() {
    $("upd").textContent = "Actualizando…";
    try {
      if (!urls) await discoverFeeds();
      const [info, status] = await Promise.all([stations.size ? null : getJSON(urls.station_information), getJSON(urls.station_status)]);
      if (info) info.data.stations.forEach(i => {
        const marker = L.circleMarker([i.lat, i.lon], { renderer: canvas, radius: 7, weight: 1.5, color: "#fff" })
          .bindPopup(() => popupHTML(stations.get(i.station_id))).addTo(map);
        stations.set(i.station_id, { info: i, status: null, cat: "off", marker, match: true,
          key: norm(i.name + " " + (i.short_name || "")), sig: "",
          ce: String(i.short_name || "").split("-").map(n => n.trim().padStart(3, "0")) });
      });
      let bikes = 0;
      status.data.stations.forEach(s => {
        const st = stations.get(s.station_id); if (!st) return;
        st.status = s; st.cat = statusOf(s); bikes += s.num_bikes_available || 0;
        if (st.marker.isPopupOpen()) st.marker.setPopupContent(popupHTML(st));
      });
      $("nSt").textContent = stations.size;
      $("nBk").textContent = bikes.toLocaleString("es-MX");
      $("upd").textContent = "Actualizado " + new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
      $("q").disabled = false;
      applyFilters();
      $("msg")?.remove();
    } catch (e) {
      console.error(e);
      $("upd").textContent = "Error al cargar";
      if (!$("msg")) {
        const d = document.createElement("div"); d.id = "msg"; d.className = "msg";
        d.textContent = "No se pudieron cargar los datos de Ecobici. Revisa tu conexión e intenta de nuevo con «Actualizar».";
        document.body.appendChild(d);
      }
    }
  }

  // Eventos
  $("menu").addEventListener("click", () => toggleMenu());
  let timer;
  function runSearch(force) {
    const p = filter.p = parseQuery($("q").value), bad = p.mode === "invalid";
    $("hint").textContent = bad ? p.msg : "";
    $("hint").className = "hint" + (bad && force ? " err" : "");
    $("q").setAttribute("aria-invalid", bad && force);
    lastSig = ""; page = 0;
    return applyFilters();
  }
  $("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => runSearch(false), 200); });
  $("q").addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    e.preventDefault(); clearTimeout(timer);
    const shown = runSearch(true);
    if ((filter.p.mode === "num" || filter.p.mode === "text") && shown.length === 1) pick(shown[0].info.station_id);
  });
  $("qx").addEventListener("click", () => { $("q").value = ""; runSearch(false); $("q").focus(); });
  $("status").addEventListener("change", e => {
    e.target.checked ? filter.on.add(e.target.value) : filter.on.delete(e.target.value);
    page = 0;
    applyFilters();
  });
  $("clear").addEventListener("click", () => {
    $("q").value = "";
    document.querySelectorAll("#status input").forEach(c => { c.checked = true; filter.on.add(c.value); });
    runSearch(false);
  });
  $("results").addEventListener("click", e => { const r = e.target.closest(".row"); if (r) pick(r.dataset.id); });
  const go = d => { page += d; applyFilters(); $("results").scrollTop = 0; };
  $("prev").addEventListener("click", () => go(-1));
  $("next").addEventListener("click", () => go(1));
  $("refresh").addEventListener("click", load);

  load();
  setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
})();
</script>
</body>
</html>
