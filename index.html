<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universidades y alcaldías de la Ciudad de México</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#f3f5f2; --panel:#ffffff; --ink:#1d2b26; --muted:#5d6b65; --line:#d5dcd7;
    --uacm:#b3261e; --otras:#2b6f8f; --alc:#3d7a5a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14201b; --panel:#1b2a24; --ink:#e8efeb; --muted:#9db0a7; --line:#30443b;
           --uacm:#ff7a70; --otras:#6cb8d6; --alc:#7fcfa0; }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  header{padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:1.35rem;margin:0 0 2px;font-weight:700}
  header p{margin:0;color:var(--muted);font-size:.92rem}
  main{flex:1;display:flex;min-height:0}
  aside{width:300px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px}
  aside h2{font-size:1rem;margin:0 0 8px;font-family:Georgia,serif}
  ul{list-style:none;margin:0 0 16px;padding:0}
  li button{width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;color:var(--ink);font:inherit;cursor:pointer}
  li button:hover,li button:focus-visible{border-color:var(--uacm);outline:2px solid var(--uacm);outline-offset:1px}
  li small{display:block;color:var(--muted)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--uacm);margin-right:7px}
  #status{font-size:.85rem;color:var(--muted);line-height:1.4}
  .leg{font-size:.85rem;color:var(--muted);margin-top:10px}
  .leg span{display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .sw{width:14px;height:14px;display:inline-block;border-radius:3px}
  #map{flex:1;min-width:0}
  .alc-label{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:600}
  @media (max-width:760px){
    main{flex-direction:column-reverse}
    aside{width:100%;max-height:38%;border-right:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<header>
  <h1>Universidades y alcaldías de la Ciudad de México</h1>
  <p>Datos de OpenStreetMap: planteles de la UACM, otras universidades y límites de las 16 alcaldías.</p>
</header>
<main>
  <aside>
    <h2>Planteles UACM</h2>
    <ul id="lista"></ul>
    <div id="status">Cargando datos de OpenStreetMap…</div>
    <div class="leg">
      <span><i class="sw" style="background:var(--uacm)"></i> Plantel UACM</span>
      <span><i class="sw" style="background:var(--otras)"></i> Otras universidades (OSM)</span>
      <span><i class="sw" style="background:var(--alc);opacity:.5"></i> Alcaldía</span>
    </div>
  </aside>
  <div id="map" role="region" aria-label="Mapa"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/osmtogeojson@3.0.0-beta.5/osmtogeojson.js"></script>
<script>
/* Coordenadas aproximadas de los planteles; ajústalas si necesitas más precisión. */
const PLANTELES = [
  {nombre:"UACM San Lorenzo Tezonco", zona:"Iztapalapa",       lat:19.3166, lng:-99.0585},
  {nombre:"UACM Casa Libertad",       zona:"Iztapalapa",       lat:19.3430, lng:-99.0560},
  {nombre:"UACM Plantel del Valle",   zona:"Benito Juárez",    lat:19.3735, lng:-99.1650},
  {nombre:"UACM Centro Histórico",    zona:"Cuauhtémoc",       lat:19.4370, lng:-99.1366},
  {nombre:"UACM Cuauhtémoc",          zona:"Cuauhtémoc",       lat:19.4130, lng:-99.1480}
];

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const status = document.getElementById("status");

const map = L.map("map").setView([19.39, -99.14], 11);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; Colaboradores de <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const capaAlc = L.layerGroup().addTo(map);
const capaOtras = L.layerGroup().addTo(map);
const capaUacm = L.layerGroup().addTo(map);
L.control.layers(null, {
  "Alcaldías": capaAlc, "Otras universidades": capaOtras, "Planteles UACM": capaUacm
}, {collapsed:false}).addTo(map);

/* Planteles UACM */
const lista = document.getElementById("lista");
PLANTELES.forEach(p => {
  const m = L.circleMarker([p.lat, p.lng], {
    radius:9, color:"#fff", weight:2, fillColor:css("--uacm"), fillOpacity:1
  }).bindPopup(`<strong>${p.nombre}</strong><br>${p.zona}`).addTo(capaUacm);
  const li = document.createElement("li");
  li.innerHTML = `<button><span class="dot"></span>${p.nombre}<small>${p.zona}</small></button>`;
  li.firstChild.onclick = () => { map.flyTo([p.lat, p.lng], 16); m.openPopup(); };
  lista.appendChild(li);
});

/* Consulta a la API Overpass de OpenStreetMap */
const OVERPASS = "https://overpass-api.de/api/interpreter";
async function overpass(q){
  const r = await fetch(OVERPASS, {method:"POST", body:"data="+encodeURIComponent(q)});
  if(!r.ok) throw new Error("Overpass respondió "+r.status);
  return osmtogeojson(await r.json());
}

const AREA = 'area["name"="Ciudad de México"]["admin_level"="4"]->.cdmx;';

async function cargarAlcaldias(){
  const gj = await overpass(`[out:json][timeout:60];${AREA}
    relation["boundary"="administrative"]["admin_level"="6"](area.cdmx);out geom;`);
  L.geoJSON(gj, {
    filter: f => f.geometry.type.includes("Polygon"),
    style: {color:css("--alc"), weight:2, fillColor:css("--alc"), fillOpacity:.08},
    onEachFeature: (f, l) => l.bindTooltip(f.properties.name || "Alcaldía", {sticky:true, className:"alc-label"})
  }).addTo(capaAlc);
}

async function cargarUniversidades(){
  const gj = await overpass(`[out:json][timeout:60];${AREA}
    nwr["amenity"="university"](area.cdmx);out center;`);
  L.geoJSON(gj, {
    pointToLayer: (f, ll) => L.circleMarker(ll, {radius:6, color:"#fff", weight:1.5, fillColor:css("--otras"), fillOpacity:.95}),
    filter: f => !/Aut[oó]noma de la Ciudad de M[eé]xico|UACM/i.test(f.properties.name || ""),
    onEachFeature: (f, l) => l.bindPopup(`<strong>${f.properties.name || "Universidad sin nombre"}</strong>`)
  }).addTo(capaOtras);
}

Promise.allSettled([cargarAlcaldias(), cargarUniversidades()]).then(r => {
  const fallos = r.filter(x => x.status === "rejected");
  status.textContent = fallos.length
    ? "No se pudieron cargar todos los datos de OSM (el servicio puede estar saturado). Recarga en un momento."
    : "Datos cargados. Haz clic en un plantel para acercarte.";
});
</script>
</body>
</html>
