<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planteles de la UACM en la Ciudad de México</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{ --bg:#f3f5f2; --panel:#fff; --ink:#1d2b26; --muted:#5d6b65; --line:#d5dcd7; --uacm:#b3261e; --otras:#2b6f8f; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14201b; --panel:#1b2a24; --ink:#e8efeb; --muted:#9db0a7; --line:#30443b; --uacm:#ff7a70; --otras:#6cb8d6; }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  header{padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:1.35rem;margin:0 0 2px}
  header p{margin:0;color:var(--muted);font-size:.92rem}
  main{flex:1;display:flex;min-height:0}
  aside{width:310px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px}
  aside h2{font-size:1rem;margin:0 0 8px;font-family:Georgia,serif}
  ul{list-style:none;margin:0 0 16px;padding:0}
  li button{width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;color:var(--ink);font:inherit;cursor:pointer}
  li button:hover,li button:focus-visible{border-color:var(--uacm);outline:2px solid var(--uacm);outline-offset:1px}
  li small{display:block;color:var(--muted);font-size:.82rem;line-height:1.3}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--uacm);margin-right:7px}
  #status{font-size:.85rem;color:var(--muted);line-height:1.4}
  .leg{font-size:.85rem;color:var(--muted);margin-top:10px}
  .leg span{display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .sw{width:14px;height:14px;display:inline-block;border-radius:3px}
  #map{flex:1;min-width:0}
  @media (max-width:760px){
    main{flex-direction:column-reverse}
    aside{width:100%;max-height:40%;border-right:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<header>
  <h1>Planteles de la UACM en la Ciudad de México</h1>
  <p>Direcciones según el sitio oficial de la UACM, ubicadas con OpenStreetMap.</p>
</header>
<main>
  <aside>
    <h2>Planteles UACM</h2>
    <ul id="lista"></ul>
    <div id="status">Ubicando planteles por dirección…</div>
    <div class="leg">
      <span><i class="sw" style="background:var(--uacm)"></i> Plantel UACM</span>
      <span><i class="sw" style="background:var(--otras)"></i> Otras universidades (OSM)</span>
    </div>
  </aside>
  <div id="map" role="region" aria-label="Mapa"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/osmtogeojson@3.0.0-beta.5/osmtogeojson.js"></script>
<script>
/* Direcciones tomadas del sitio oficial de la UACM.
   "lat/lng" son coordenadas de respaldo (aproximadas) que se usan solo si la búsqueda por dirección falla. */
const PLANTELES = [
  {nombre:"UACM Centro Histórico", alcaldia:"Cuauhtémoc",
   dir:"Fray Servando T. de Mier 92 y 99, Col. Obrera",
   q:"Fray Servando Teresa de Mier 99, Obrera, Cuauhtémoc, Ciudad de México",
   lat:19.4234, lng:-99.1288},
  {nombre:"UACM Del Valle", alcaldia:"Benito Juárez",
   dir:"San Lorenzo 290, esq. Roberto Gayol, Col. Del Valle",
   q:"Avenida San Lorenzo 290, Del Valle Sur, Benito Juárez, Ciudad de México",
   lat:19.3735, lng:-99.1650},
  {nombre:"UACM San Lorenzo Tezonco", alcaldia:"Iztapalapa",
   dir:"Prolongación San Isidro 151, Col. San Lorenzo Tezonco",
   q:"Prolongación San Isidro 151, San Lorenzo Tezonco, Iztapalapa, Ciudad de México",
   lat:19.3166, lng:-99.0585},
  {nombre:"UACM Casa Libertad", alcaldia:"Iztapalapa",
   dir:"Calz. Ermita Iztapalapa 4163, Col. Lomas de Zaragoza",
   q:"Calzada Ermita Iztapalapa 4163, Lomas de Zaragoza, Iztapalapa, Ciudad de México",
   lat:19.3380, lng:-99.0440},
  {nombre:"UACM Cuautepec", alcaldia:"Gustavo A. Madero",
   dir:"Av. La Corona 320, Col. Loma La Palma",
   q:"Avenida La Corona 320, Loma la Palma, Gustavo A. Madero, Ciudad de México",
   lat:19.5360, lng:-99.1330}
];

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const status = document.getElementById("status");
const pausa = ms => new Promise(r => setTimeout(r, ms));

const map = L.map("map").setView([19.40, -99.13], 11);
const atrib = '&copy; Colaboradores de <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const base = {
  "Mapa claro (CARTO)": L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    maxZoom:19, subdomains:"abcd", attribution: atrib + ' &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }),
  "OpenStreetMap estándar": L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19, attribution: atrib, referrerPolicy:"strict-origin-when-cross-origin"
  })
};
base["Mapa claro (CARTO)"].addTo(map);

const capaOtras = L.layerGroup().addTo(map);
const capaUacm = L.layerGroup().addTo(map);
L.control.layers(base, {"Otras universidades": capaOtras, "Planteles UACM": capaUacm}, {collapsed:false}).addTo(map);

function popup(p, nota){
  return `<strong>${p.nombre}</strong><br>${p.dir}<br>${p.alcaldia}<br><em>${nota}</em>`;
}

/* Marcadores + lista lateral */
const lista = document.getElementById("lista");
PLANTELES.forEach(p => {
  p.marker = L.circleMarker([p.lat, p.lng], {radius:9, color:"#fff", weight:2, fillColor:css("--uacm"), fillOpacity:1})
    .bindPopup(popup(p, "Ubicación aproximada")).addTo(capaUacm);
  const li = document.createElement("li");
  li.innerHTML = `<button><span class="dot"></span>${p.nombre}<small>${p.dir}</small></button>`;
  li.firstChild.onclick = () => { map.flyTo(p.marker.getLatLng(), 17); p.marker.openPopup(); };
  lista.appendChild(li);
});
map.fitBounds(L.featureGroup(PLANTELES.map(p => p.marker)).getBounds().pad(0.15));

/* Ubica cada plantel por su dirección con Nominatim (1 petición por segundo). */
async function ubicarPorDireccion(){
  let ok = 0;
  for(const p of PLANTELES){
    try{
      const u = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=mx"
        + "&viewbox=-99.37,19.60,-98.94,19.05&bounded=1&q=" + encodeURIComponent(p.q);
      const r = await (await fetch(u, {referrerPolicy:"strict-origin-when-cross-origin"})).json();
      if(r.length){
        p.marker.setLatLng([+r[0].lat, +r[0].lon]);
        p.marker.setPopupContent(popup(p, "Ubicada por dirección en OpenStreetMap"));
        ok++;
      }
    }catch(e){ console.warn(p.nombre, e); }
    await pausa(1100);
  }
  status.textContent = ok === PLANTELES.length
    ? "Los cinco planteles se ubicaron por su dirección."
    : `${ok} de ${PLANTELES.length} planteles ubicados por dirección; el resto usa una posición aproximada.`;
}

/* Otras universidades (API Overpass de OSM) */
const SERVIDORES = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter"
];
async function overpass(q){
  let ultimo;
  for(const url of SERVIDORES){
    try{
      const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:"data="+encodeURIComponent(q)});
      if(!r.ok) throw new Error("Overpass respondió "+r.status);
      return osmtogeojson(await r.json());
    }catch(e){ ultimo = e; }
  }
  throw ultimo;
}
async function cargarUniversidades(){
  const gj = await overpass(`[out:json][timeout:60];rel(1376330);map_to_area->.cdmx;nwr["amenity"="university"](area.cdmx);out center;`);
  L.geoJSON(gj, {
    pointToLayer:(f, ll) => L.circleMarker(ll, {radius:6, color:"#fff", weight:1.5, fillColor:css("--otras"), fillOpacity:.95}),
    filter: f => !/Aut[oó]noma de la Ciudad de M[eé]xico|UACM/i.test(f.properties.name || ""),
    onEachFeature:(f, l) => l.bindPopup(`<strong>${f.properties.name || "Universidad sin nombre"}</strong>`)
  }).addTo(capaOtras);
}

ubicarPorDireccion();
cargarUniversidades().catch(() => console.warn("No se pudieron cargar otras universidades"));
</script>
</body>
</html>
